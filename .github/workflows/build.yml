name: Build and Push Docker Image

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'

# Coalesce in-flight runs on rapid consecutive pushes to main so the
# 21-minute build queue never piles up. The latest commit cancels any
# older run on the same branch; the scheduled weekly run gets its own
# group key so a Monday cron does not cancel a Friday push and vice
# versa.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OpenCode ships near daily and its download URL is pinned by tag in
      # the Dockerfile, so the newest tag is resolved here and handed to
      # the build as an arg. This keeps the version inside the layer cache
      # key: the previous `releases/latest` URL lived inside a RUN, which
      # Docker cannot see into, so the layer stayed cached and the binary
      # silently froze at whatever version it was first built with.
      - name: Resolve latest OpenCode release
        id: opencode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(gh api repos/anomalyco/opencode/releases/latest --jq '.tag_name' | sed 's/^v//')"
          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "Could not resolve an OpenCode release tag." >&2
            exit 1
          fi
          echo "Resolved OpenCode version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            OPENCODE_VERSION=${{ steps.opencode.outputs.version }}
          tags: |
            ghcr.io/anilcancakir/kodizm-ai-docker:latest
            ghcr.io/anilcancakir/kodizm-ai-docker:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/anilcancakir/kodizm-ai-docker:buildcache
          cache-to: type=registry,ref=ghcr.io/anilcancakir/kodizm-ai-docker:buildcache,mode=max
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
