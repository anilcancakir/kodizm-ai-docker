name: Build and Push Docker Image

# No schedule on purpose: floating tags rebuilt weekly produced an image whose layers all changed.
# Rebuilds happen on merged Renovate PRs and other pushes to main, and when acp-follow.yml moves the
# @kodizm/acp pin to a new release (a version check, not a rebuild on a clock).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer PR push cancels the older build; a main run is never cancelled, so a promotion cannot be
# cut off between the candidate push and the `:latest` retag.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REPOSITORY: ghcr.io/anilcancakir/kodizm-ai-docker
  # Pinned release binary; bump the version and the checksum together.
  CONTAINER_STRUCTURE_TEST_VERSION: v1.22.1
  CONTAINER_STRUCTURE_TEST_SHA256: fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Only a run on main publishes. Pull requests (forks included) and dispatches from other
      # refs build into the local daemon and never see the registry write token or API key.
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
      IMAGE: ${{ github.ref == 'refs/heads/main' && format('ghcr.io/anilcancakir/kodizm-ai-docker:cand-{0}', github.sha) || 'kodizm-agent:test' }}

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      # The smoke script's judge functions are unit-tested on the runner, before any image is built.
      - name: Set up Node for the smoke self-test
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Smoke script self-test
        run: node --test tests/*.test.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install container-structure-test
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/container-structure-test \
            "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CONTAINER_STRUCTURE_TEST_VERSION}/container-structure-test-linux-amd64"
          echo "${CONTAINER_STRUCTURE_TEST_SHA256}  /tmp/container-structure-test" | sha256sum -c -
          sudo install -m 0755 /tmp/container-structure-test /usr/local/bin/container-structure-test

      # The build fails until the @kodizm/acp version the Dockerfile pins is published to npm.
      - name: Build (no push)
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          provenance: false
          tags: ${{ env.IMAGE }}
          cache-from: type=registry,ref=${{ env.REPOSITORY }}:buildcache

      # zstd layers shrink the pull. If GHCR or a Docker host rejects them, set compression=gzip in
      # both `outputs` and `cache-to` (and drop oci-mediatypes if the registry still refuses).
      - name: Build and push candidate
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push=true,compression=zstd,compression-level=6,force-compression=true,oci-mediatypes=true
          cache-from: type=registry,ref=${{ env.REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ env.REPOSITORY }}:buildcache,mode=max,compression=zstd,oci-mediatypes=true

      # The gates run against the registry copy, which is exactly what promotion retags.
      - name: Pull candidate
        if: env.PUBLISH == 'true'
        run: docker pull "${IMAGE}"

      # The unpacked size and the biggest layers show in every run's summary.
      - name: Image size
        run: |
          set -euo pipefail
          {
            echo "### Image size"
            echo "unpacked: $(docker image inspect "${IMAGE}" --format '{{.Size}}' | numfmt --to=iec)"
            echo '```'
            docker history --format '{{.Size}}  {{.CreatedBy}}' "${IMAGE}" | sort -h -r | head -8 | cut -c1-160
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      # What a Docker host pulls is the compressed layers of the registry manifest. Its pull guard asks
      # for five times the missing bytes, so the budgets below keep the image pullable.
      - name: Compressed size (registry)
        if: env.PUBLISH == 'true'
        env:
          MAX_COMPRESSED_BYTES: '6000000000'
          MAX_LAYER_BYTES: '1610612736'
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "${IMAGE}" --raw)"
          total="$(jq '[.layers[].size] | add' <<<"${manifest}")"
          largest="$(jq '[.layers[].size] | max' <<<"${manifest}")"
          {
            echo "### Compressed size"
            echo "layers: $(jq '.layers | length' <<<"${manifest}"), total $(numfmt --to=iec "${total}"), largest $(numfmt --to=iec "${largest}")"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          [ "${total}" -le "${MAX_COMPRESSED_BYTES}" ] || { echo "compressed size ${total} exceeds ${MAX_COMPRESSED_BYTES}" >&2; exit 1; }
          [ "${largest}" -le "${MAX_LAYER_BYTES}" ] || { echo "largest layer ${largest} exceeds ${MAX_LAYER_BYTES}" >&2; exit 1; }

      - name: Structure test
        run: container-structure-test test --image "${IMAGE}" --config tests/structure-test.yaml

      - name: Smoke test
        run: docker run --rm -v "${PWD}/scripts:/smoke:ro" "${IMAGE}" bash /smoke/smoke.sh

      - name: LSP probe
        run: |
          docker run --rm \
            -v "${PWD}/scripts:/smoke:ro" \
            -v "${PWD}/tests/fixtures:/fixtures:ro" \
            -e LSP_FIXTURES=/fixtures \
            "${IMAGE}" node /smoke/lsp-probe.mjs

      - name: Real call
        if: env.PUBLISH == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Both optional: the Kodizm gateway URL and a model it serves (repository variables).
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          SMOKE_MODEL: ${{ vars.SMOKE_MODEL }}
        run: |
          docker run --rm \
            -e ANTHROPIC_API_KEY -e ANTHROPIC_BASE_URL -e SMOKE_MODEL \
            -v "${PWD}/scripts:/smoke:ro" \
            "${IMAGE}" bash /smoke/real-call-smoke.sh

      # A CLI bump that breaks a GATE check fails here, before promote. OBSERVE checks never fail the
      # step. An empty CLAUDE_CODE_OAUTH_TOKEN makes the oauth checks SKIP.
      - name: Real CLI smoke
        if: env.PUBLISH == 'true'
        timeout-minutes: 45
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          SMOKE_MODEL: ${{ vars.SMOKE_MODEL }}
        run: |
          set -uo pipefail
          rc=0
          docker run --rm \
            -e ANTHROPIC_API_KEY -e CLAUDE_CODE_OAUTH_TOKEN -e ANTHROPIC_BASE_URL -e SMOKE_MODEL \
            -v "${PWD}/scripts:/smoke:ro" \
            "${IMAGE}" node /smoke/real-cli-smoke.mjs 2>&1 | tee /tmp/real-cli-smoke.log || rc=$?
          {
            echo "### Real CLI smoke"
            echo '```'
            if grep -q '^=== SMOKE REPORT ===$' /tmp/real-cli-smoke.log; then
              sed -n '/^=== SMOKE REPORT ===$/,/^=== END SMOKE REPORT ===$/p' /tmp/real-cli-smoke.log
            else
              echo "the smoke printed no report (exit code ${rc})"
            fi
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${rc}"

  promote:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry-side retag of the tested manifest: nothing is rebuilt or re-pushed layer by layer.
      - name: Promote candidate
        run: |
          set -euo pipefail
          dated="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          docker buildx imagetools create \
            --tag "${REPOSITORY}:latest" \
            --tag "${REPOSITORY}:${dated}" \
            "${REPOSITORY}:cand-${GITHUB_SHA}"
          docker buildx imagetools inspect "${REPOSITORY}:${dated}"
