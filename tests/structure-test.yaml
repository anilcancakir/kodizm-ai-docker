schemaVersion: "2.0.0"

# ---------------------------------------------------------------------------
# Contract for the lean Debian 13 agent image. Written before the Dockerfile:
# the Dockerfile is done when this passes. Behaviour (handshake, Postgres, LSP
# answers) lives in scripts/smoke.sh and scripts/lsp-probe.mjs.
# ---------------------------------------------------------------------------

commandTests:
  # User
  - name: "agent user exists with UID 1001"
    command: "id"
    args: ["agent"]
    expectedOutput: ["uid=1001"]

  # PHP: both versions installed, 8.5 is the default
  - name: "php default is 8.5"
    command: "php"
    args: ["-v"]
    expectedOutput: ["PHP 8\\.5\\."]
  - name: "php8.3 binary exists"
    command: "php8.3"
    args: ["-v"]
    expectedOutput: ["PHP 8\\.3\\."]
  - name: "php8.5 binary exists"
    command: "php8.5"
    args: ["-v"]
    expectedOutput: ["PHP 8\\.5\\."]

  # Node toolchain
  - name: "node is 24"
    command: "node"
    args: ["--version"]
    expectedOutput: ["^v24\\."]
  - name: "pnpm available"
    command: "pnpm"
    args: ["--version"]
    expectedOutput: ["\\d+\\."]
  - name: "yarn available (DependencyInstallService runs yarn install --frozen-lockfile)"
    command: "yarn"
    args: ["--version"]
    expectedOutput: ["^1\\."]
  - name: "corepack available"
    command: "corepack"
    args: ["--version"]
    expectedOutput: ["\\d+\\."]
  - name: "bun available"
    command: "bun"
    args: ["--version"]
    expectedOutput: ["\\d+\\."]

  # Python, Go, Dart, Flutter
  - name: "python3.13 available"
    command: "python3.13"
    args: ["--version"]
    expectedOutput: ["Python 3\\.13\\."]
  - name: "uv available"
    command: "uv"
    args: ["--version"]
    expectedOutput: ["uv \\d+\\."]
  - name: "go available"
    command: "go"
    args: ["version"]
    expectedOutput: ["go version go\\d+\\."]
  - name: "dart available"
    command: "dart"
    args: ["--version"]
    expectedOutput: ["Dart SDK version"]
  - name: "flutter available"
    command: "flutter"
    args: ["--version"]
    expectedOutput: ["Flutter \\d+\\."]

  # PostgreSQL client and the in-container server launcher
  - name: "psql client available"
    command: "psql"
    args: ["--version"]
    expectedOutput: ["psql \\(PostgreSQL\\)"]
  - name: "kodizm-pg on PATH"
    command: "sh"
    args: ["-c", "command -v kodizm-pg"]
    expectedOutput: ["/kodizm-pg"]

  # Live sessions run the interactive CLI inside a tmux pane
  - name: "tmux 3 available"
    command: "tmux"
    args: ["-V"]
    expectedOutput: ["tmux 3\\."]

  # Agent CLIs and the ACP bridge
  - name: "claude on PATH"
    command: "sh"
    args: ["-c", "command -v claude"]
    expectedOutput: ["/claude"]
  - name: "claude reports a version"
    command: "claude"
    args: ["--version"]
    expectedOutput: ["^\\d+\\.\\d+\\.\\d+"]
  - name: "opencode on PATH"
    command: "sh"
    args: ["-c", "command -v opencode"]
    expectedOutput: ["/opencode"]
  - name: "opencode ACP subcommand available"
    command: "opencode"
    args: ["acp", "--help"]
    exitCode: 0
  - name: "kodizm-acp on PATH"
    command: "sh"
    args: ["-c", "command -v kodizm-acp"]
    expectedOutput: ["/kodizm-acp"]
  - name: "kodizm-acp carries the tmuxd Live session runtime"
    command: "kodizm-acp"
    args: ["tmuxd", "--help"]
    expectedOutput: ["ctl"]
  - name: "kodizm-acp tmuxd lists the 0.9.0 start flags"
    command: "kodizm-acp"
    args: ["tmuxd", "--help"]
    expectedOutput:
      - "--permission-mode"
      - "--mcp-config"
      - "--one-shot"
      - "KODIZM_TMUXD_IDLE_TIMEOUT_SECONDS"
  # No daemon is running, so ctl answers for itself: pane_not_running (exit 4) stamped with its own build version.
  - name: "kodizm-acp tmuxd ctl status stamps daemon_version"
    command: "kodizm-acp"
    args: ["tmuxd", "ctl", "status", "--pane", "structure-probe"]
    exitCode: 4
    expectedOutput: ["\"daemon_version\":\"(0\\.(9|[1-9]\\d+)|[1-9]\\d*)\\."]

  # Language servers the baked .lsp.json launches (swift and html are not installed)
  - name: "intelephense on PATH"
    command: "sh"
    args: ["-c", "command -v intelephense"]
    expectedOutput: ["/intelephense"]
  - name: "typescript-language-server on PATH"
    command: "sh"
    args: ["-c", "command -v typescript-language-server"]
    expectedOutput: ["/typescript-language-server"]
  - name: "pyrefly on PATH"
    command: "sh"
    args: ["-c", "command -v pyrefly"]
    expectedOutput: ["/pyrefly"]
  - name: "gopls on PATH"
    command: "sh"
    args: ["-c", "command -v gopls"]
    expectedOutput: ["/gopls"]

fileExistenceTests:
  - name: "claude binary where the ACP bridge looks for it"
    path: "/usr/local/bin/claude"
    shouldExist: true
  - name: "ac-lsp plugin manifest"
    path: "/opt/kodizm/plugins/ac-lsp/.lsp.json"
    shouldExist: true
  - name: "ac-lsp proxy"
    path: "/opt/kodizm/plugins/ac-lsp/bin/lsp-proxy.js"
    shouldExist: true
  - name: "opencode LSP config"
    path: "/opt/kodizm/opencode.lsp.json"
    shouldExist: true
  - name: "versions manifest"
    path: "/opt/kodizm/versions.json"
    shouldExist: true

fileContentTests:
  # scripts/smoke.sh reads exactly these keys.
  - name: "versions.json pins claude"
    path: "/opt/kodizm/versions.json"
    expectedContents: ["\"claude\"\\s*:\\s*\"\\d+\\.\\d+\\.\\d+"]
  - name: "versions.json pins opencode"
    path: "/opt/kodizm/versions.json"
    expectedContents: ["\"opencode\"\\s*:\\s*\"\\d+\\.\\d+\\.\\d+"]
  - name: "versions.json pins kodizm_acp"
    path: "/opt/kodizm/versions.json"
    expectedContents: ["\"kodizm_acp\"\\s*:\\s*\"\\d+\\.\\d+\\.\\d+"]
  - name: "versions.json pins kodizm_acp 0.9 or newer"
    path: "/opt/kodizm/versions.json"
    expectedContents: ["\"kodizm_acp\"\\s*:\\s*\"(0\\.(9|[1-9]\\d+)|[1-9]\\d*)\\."]
  - name: "versions.json records php"
    path: "/opt/kodizm/versions.json"
    expectedContents: ["\"php\"\\s*:\\s*\"\\d+\\."]
  - name: "versions.json records node"
    path: "/opt/kodizm/versions.json"
    expectedContents: ["\"node\"\\s*:\\s*\"\\d+\""]
